# corvus.example.toml —— 最小可用配置示例
# 用法：复制为 <项目根>/.corvus/config.toml（项目级）或 ~/.corvus/config.toml（本机全局），
# 然后按需修改。本文件只是示例，不会被程序读取；真实密钥请勿提交到仓库。
#
# 层级优先级（高 → 低）：
#   flag（命令行参数） > 项目 .corvus/config.toml > ~/.corvus/config.toml > 内置默认值
# 注意：[[providers]] 按 name 合并，同一名称的 provider 条目中，
#   ~/.corvus/config.toml 优先于项目 .corvus/config.toml（例如在 ~/.corvus 里
#   只写 api_key 即可覆盖项目里的同名 provider 密钥，无需重复完整定义）。
# API key 直接写在条目的 api_key 字段（也可用旧的 api_key_env 从环境变量注入，
# 但 api_key 优先）。

# 默认模型：格式为 "provider/model"；也可以只写 provider 名（取其 default 模型）
# 或裸模型名（取第一个列出该模型的 provider）。
default_model = "deepseek/deepseek-chat"
# language = "zh"                      # 界面/默认回复语言（zh | en；空 = 按 $LANG 自动检测）

[ui]
# 界面主题：auto | dark | light（空 = 自动）
theme = "auto"
# show_reasoning = false               # Ctrl+O / /verbose：在 CLI 中展开思考文本；false = 折叠

[agent]
# 会话默认温度（0.0–2.0；省略则使用供应商默认值）
temperature = 0.2

[network_policy]
# 出口网络策略（web_fetch 与 bash 内可识别的 curl/wget 等命令）：
# 规则为主机名 glob：example.com 精确、*.example.com 一层子域、**.example.com 任意深度；
# deny 优先于 allow；default = allow（保持现状放行）| deny（fail-closed）| ask（无审批 UI 时回退 allow）。
default = "allow"
# allow   = ["docs.example.com"]
# deny    = ["*.internal.corp", "10.0.0.0"]

[web_search]
# 本地 web_search 工具（模型可直接调用，与 provider 无关）。
# engine: searxng（自建实例，需 base_url）| brave | tavily（需 api_key）。
# 留空 = 不注册 web_search 工具。配置后会自动关闭 provider 侧的
# server-side web_search，避免同一名字出现两个工具。
# engine = "searxng"
# base_url = "https://search.example.com"   # searxng 实例地址（自动补 /search）
# api_key = "..."                           # brave / tavily 的 API key
# max_results = 8                           # 每次最多返回条数（1–20，默认 8）

# 供应商条目。kind 是协议类型（如 openai / anthropic / responses）；
# OpenAI 兼容网关通常用 "openai"。
[[providers]]
name = "deepseek"                      # 供应商名称（default_model 与 /provider 切换用）
kind = "openai"                        # 协议类型
base_url = "https://api.deepseek.com"  # OpenAI 兼容网关地址
models = ["deepseek-chat", "deepseek-reasoner"]  # 该供应商可用的模型列表
default = "deepseek-chat"              # 默认模型；省略时取 models[0]
api_key = "sk-..."                     # API key 占位符：替换为真实密钥，请勿提交

# 其他可选字段（示例中无需全部填写）：
# context_window = 65536    # 上下文窗口大小（token）
# effort = "medium"         # 思考力度（low | medium | high，取决于模型/供应商支持）
# api_key_env = "DEEPSEEK_API_KEY"  # 从环境变量注入密钥；api_key 优先于 api_key_env
# max_output_tokens = 8192  # 单次回复输出上限（token；0 = 供应商默认）
# balance_url = "https://api.deepseek.com/user/balance"  # 余额查询端点（可选；留空 = 不查询）
# price = { input = 0.14, cache_hit = 0.0028, output = 0.28, currency = "$" }  # 计费（每百万 token）
# prices = { "deepseek-reasoner" = { input = 2.0, output = 8.0, currency = "$" } }  # 按模型计费，优先于 price
# model_overrides = { "deepseek-reasoner" = { supported_efforts = ["disabled", "high"], default_effort = "high" } }  # 单模型参数覆盖
